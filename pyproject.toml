[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robolab-collecting-pipeline"
version = "0.1.0"
description = "RoboLab Panda/Robotiq/GELLO demonstration collection with a D405 wrist camera"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "h5py>=3.8", "Pillow>=9"]

[project.scripts]
pi05-demo-collect = "pi05_demo.collect:main"
pi05-demo-export = "pi05_demo.export:main"
pi05-demo-review = "pi05_demo.review:main"
pi05-demo-curate = "pi05_demo.curation.__main__:main"
pi05-demo-preflight = "pi05_demo.preflight:main"

[tool.setuptools.packages.find]
include = ["pi05_demo*"]

[tool.setuptools.package-data]
"pi05_demo.curation" = ["static/*.html", "static/*.js", "static/*.css"]
